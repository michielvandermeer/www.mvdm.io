name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, so `git log` can date each page below. The default
          # of one commit would stamp every page with this deploy's own date.
          fetch-depth: 0

      - name: Check every page's address copies against sitemap.xml
        shell: bash
        run: |
          set -euo pipefail

          # Runs first, on the committed files, so a wrong address fails the
          # run before anything is built or published. Every page in
          # sitemap.xml must write its own address the way the sitemap does,
          # in each copy below; addresses that point at other pages
          # (publisher, author, offers, earlier breadcrumb items) are not
          # compared. Every problem is listed, then the step exits 1.
          python3 - <<'PY'
          import json
          import re
          import sys
          from html.parser import HTMLParser
          from pathlib import Path

          SITE = "https://mvdm.io"
          errors = []


          class Head(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.canonical = []
                  self.meta = {"og:url": [], "og:image": []}
                  self.ld = []
                  self.in_ld = False

              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "link" and "canonical" in (a.get("rel") or "").split():
                      self.canonical.append(a.get("href"))
                  elif tag == "meta" and a.get("property") in self.meta:
                      self.meta[a["property"]].append(a.get("content"))
                  elif tag == "script" and a.get("type") == "application/ld+json":
                      self.ld.append("")
                      self.in_ld = True

              def handle_endtag(self, tag):
                  if tag == "script":
                      self.in_ld = False

              def handle_data(self, data):
                  if self.in_ld:
                      self.ld[-1] += data


          def problem(page, text):
              errors.append(f"::error::{page}: {text}")


          def compare(page, copy, found, expected):
              if found != expected:
                  problem(page, f"{copy} is {found}, expected {expected}")


          def single(page, name, plural, values, expected):
              """Exactly one copy, equal to expected; returns it when there is one."""
              if len(values) == 0:
                  problem(page, f"has no {name}")
              elif len(values) > 1:
                  count = "two" if len(values) == 2 else len(values)
                  problem(page, f"has {count} {plural}")
              else:
                  compare(page, name, values[0], expected)
                  return values[0]
              return None


          def check_node(page, node, og_image):
              kind = node.get("@type", "structured data")
              if "url" in node:
                  compare(page, f"{kind} url", node["url"], page)
              if isinstance(node.get("mainEntityOfPage"), str):
                  compare(page, f"{kind} mainEntityOfPage", node["mainEntityOfPage"], page)
              if "@id" in node and not str(node["@id"]).startswith(page + "#"):
                  problem(page, f"{kind} @id is {node['@id']}, expected starting with {page}#")
              if kind == "BlogPosting" and og_image is not None:
                  compare(page, "BlogPosting image", node.get("image"), og_image)
              if kind == "BreadcrumbList":
                  steps = [s for s in node.get("itemListElement", []) if "position" in s and "item" in s]
                  last = max(steps, key=lambda s: s["position"])["item"] if steps else "none"
                  compare(page, "last breadcrumb item", last, page)


          def check_page(page, file):
              head = Head()
              head.feed(file.read_text(encoding="utf-8"))
              path = page[len(SITE):].strip("/")
              single(page, "canonical link", "canonical links", head.canonical, page)
              single(page, "og:url", "og:url", head.meta["og:url"], page)
              og_image = single(
                  page, "og:image", "og:image", head.meta["og:image"],
                  f"{SITE}/assets/share-cards/{path or 'index'}.png",
              )
              for block in head.ld:
                  try:
                      data = json.loads(block)
                      nodes = data["@graph"] if isinstance(data, dict) and "@graph" in data else [data]
                      if not isinstance(nodes, list) or not all(isinstance(n, dict) for n in nodes):
                          raise ValueError("not a list of objects")
                      for node in nodes:
                          check_node(page, node, og_image)
                  except (ValueError, TypeError, KeyError):
                      problem(page, "its structured data does not parse")


          for page in re.findall(r"<loc>([^<]*)</loc>", Path("sitemap.xml").read_text(encoding="utf-8")):
              path = page[len(SITE):]
              file = Path("index.html" if path == "/" else path.lstrip("/") + "index.html")
              if file.is_file():
                  check_page(page, file)
              else:
                  problem(page, f"page file {file} is missing")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Add lastmod to sitemap.xml from git history
        shell: bash
        run: |
          set -euo pipefail

          # Rewrites the runner's copy only; the committed sitemap.xml keeps
          # listing addresses. Each <loc> gets the date its own page file was
          # last committed (shared files like the stylesheet never count).
          tmp="$(mktemp)"
          loc_re='<loc>([^<]*)</loc>'
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ "$line" =~ $loc_re ]]; then
              addr="${BASH_REMATCH[1]}"
              path="${addr#https://mvdm.io}"
              if [ "$path" = "/" ]; then
                file="index.html"
              else
                file="${path#/}index.html"
              fi
              # Git still dates a deleted path (with the deleting commit), so
              # only the working tree can tell that the page file is gone.
              if [ ! -f "$file" ]; then
                echo "::error::Page file missing for $addr (looked for $file; deleted, or renamed with the old address left in sitemap.xml). Remove or correct the sitemap entry." >&2
                exit 1
              fi
              date="$(git log -1 --format=%cs -- "$file")"
              # A shallow checkout still answers with its one commit, which
              # would be the wrong date, so it counts as no date at all.
              if [ -z "$date" ] || [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                echo "::error::No git date for $addr (looked for $file; shallow checkout, or a file git has no commit for)" >&2
                exit 1
              fi
              line="${line%%</loc>*}</loc><lastmod>${date}</lastmod>${line#*</loc>}"
            fi
            printf '%s\n' "$line"
          done < sitemap.xml > "$tmp"
          mv "$tmp" sitemap.xml

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Render legal PDFs, build the legal pack, and render share cards
        run: |
          set -euo pipefail

          # Serve the checkout so root-relative asset/nav links (e.g. /assets/css/site.css)
          # resolve the same way they do in production — a plain file:// load would not.
          python3 -m http.server 8080 --directory . &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8080/legal/ >/dev/null && break
            sleep 0.5
          done

          TOOLDIR="${RUNNER_TEMP}/puppeteer-tools"
          mkdir -p "$TOOLDIR"
          npm install --prefix "$TOOLDIR" puppeteer@23.9.0

          NODE_PATH="$TOOLDIR/node_modules" node <<'NODE'
          const puppeteer = require("puppeteer");
          const fs = require("fs");
          const path = require("path");

          const legalDocs = [
            ["terms", "terms-of-service.pdf"],
            ["privacy", "privacy-notice.pdf"],
            ["dpa", "data-processing-agreement.pdf"],
            ["subprocessors", "subprocessor-list.pdf"],
            ["company", "company-details.pdf"],
            ["partners", "partner-terms.pdf"],
          ];

          // Page list: every URL in sitemap.xml, plus 404.html which is
          // deliberately not in the sitemap. Parsing <loc> with a regex is
          // enough — no XML library needed for a file this shaped.
          const sitemap = fs.readFileSync("sitemap.xml", "utf8");
          const locs = [...sitemap.matchAll(/<loc>(.*?)<\/loc>/g)].map((m) => m[1]);

          const sharePages = locs.map((loc) => {
            const u = new URL(loc);
            return { loadUrl: `http://localhost:8080${u.pathname}`, urlPath: u.pathname };
          });
          sharePages.push({ loadUrl: "http://localhost:8080/404.html", urlPath: "/404.html" });

          // Mirror the URL into assets/share-cards/<path>.png:
          //   /                     -> assets/share-cards/index.png
          //   /products/compliance/ -> assets/share-cards/products/compliance.png
          //   /404.html             -> assets/share-cards/404.png
          function outputPathFor(urlPath) {
            if (urlPath === "/404.html") {
              return "assets/share-cards/404.png";
            }
            let trimmed = urlPath.replace(/^\/|\/$/g, "");
            if (trimmed === "") {
              trimmed = "index";
            }
            return `assets/share-cards/${trimmed}.png`;
          }

          (async () => {
            // One browser for both halves of this step: the legal PDFs and
            // the share cards are two loops over the same launch, not two
            // launches.
            const browser = await puppeteer.launch({
              args: ["--no-sandbox", "--disable-setuid-sandbox"],
            });

            for (const [dir, file] of legalDocs) {
              const page = await browser.newPage();
              await page.goto(`http://localhost:8080/legal/${dir}/`, { waitUntil: "networkidle0" });
              await page.pdf({
                path: `legal/${dir}/${file}`,
                format: "A4",
                printBackground: true,
                margin: { top: "20mm", bottom: "20mm", left: "18mm", right: "18mm" },
              });
              await page.close();
            }

            for (const { loadUrl, urlPath } of sharePages) {
              const page = await browser.newPage();
              await page.goto(loadUrl, { waitUntil: "networkidle0" });

              let { headline, eyebrow, product } = await page.evaluate(() => {
                const h1 = document.querySelector("h1");
                const eyebrowEl = document.querySelector(".eyebrow");
                return {
                  headline: h1 ? h1.innerHTML.trim() : "",
                  eyebrow: eyebrowEl ? eyebrowEl.textContent.trim() : "",
                  product: document.documentElement.getAttribute("data-product") || "",
                };
              });

              if (!headline) {
                throw new Error(`No <h1> found on ${loadUrl} — cannot draw its share card`);
              }

              if (!eyebrow) {
                // Spec: "404.html has no eyebrow element, so its card uses
                // mvdmio · 404" — that default belongs to 404.html alone.
                // Any other page missing one is a real gap, so it fails the
                // deploy the same way a missing headline does, rather than
                // silently shipping a card mislabelled 404.
                if (urlPath === "/404.html") {
                  eyebrow = "mvdmio · 404";
                } else {
                  throw new Error(`No .eyebrow found on ${loadUrl} — cannot draw its share card`);
                }
              }

              if (urlPath === "/") {
                // Story 6: the homepage's card should speak for mvdmio, not
                // for whichever Product leads its hero. Reuse the page's own
                // og:title (brand-first: "mvdmio | <the five Products>";
                // the <title> carries search keywords instead) in place of
                // its hero <h1>/.eyebrow — no new copy, same rule as every
                // other field in this block.
                const titleText = await page.$eval(
                  'meta[property="og:title"]',
                  (el) => el.getAttribute("content"),
                );
                const sep = " | ";
                const idx = titleText.indexOf(sep);
                if (idx === -1) {
                  throw new Error(`No "${sep}" separator in the homepage og:title, cannot draw its share card`);
                }
                eyebrow = "mvdmio";
                headline = titleText.slice(idx + sep.length);
              }

              const params = new URLSearchParams();
              params.set("eyebrow", eyebrow);
              params.set("headline", headline);
              if (product) {
                params.set("product", product);
              }

              await page.setViewport({ width: 1200, height: 630 });
              await page.goto(`http://localhost:8080/assets/share-card.html?${params.toString()}`, {
                waitUntil: "networkidle0",
              });
              await page.waitForFunction(
                () => document.documentElement.getAttribute("data-ready") === "true",
                { timeout: 15000 },
              );

              const outPath = outputPathFor(urlPath);
              fs.mkdirSync(path.dirname(outPath), { recursive: true });
              await page.screenshot({ path: outPath });
              await page.close();
            }

            await browser.close();
          })();
          NODE

          zip -j legal/mvdmio-legal-pack.zip legal/*/*.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
