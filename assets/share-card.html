<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Share card template</title>

<!--
  This is a TOOL, not a page: it is never added to sitemap.xml or feed.xml,
  carries no Share card of its own, and has no site header, footer or nav.
  It is driven by the deploy render (step 02) with three query parameters —
  eyebrow, headline, product — and screenshotted at a 1200x630 viewport.

  It links the site's own stylesheet so the card reads the real Boardroom
  tokens and can never drift from the palette. It takes only the tokens:
  every element below carries a share-card-* class name that site.css does
  not use, so no page component can reach in. Reusing site.css's own class
  names here — .card, .eyebrow, .wordmark — inherits a whole page component
  (a white panel with a hairline border, rounded corners, and `.card p
  { flex: 1 }`, which grows the eyebrow and shoves the headline onto the
  signature). Its own <style> block holds only the card's layout, which
  does not exist as a page pattern.

  The inline <script> at the bottom reads those three query parameters —
  AGENTS.md's "don't add inline <script> blocks to pages" governs pages a
  reader visits, and this file is not one of those.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">

<style>
  /* Card layout — variant B "Accent field" from
     .agents/prototypes/share-card/, minus the URL line, foot signed
     mvdm.io. Not a reusable site pattern, so it lives here rather than in
     site.css: this is the only page that ever draws a card. */
  html, body {
    /* site.css lays body out as a min-height flex column for a real page;
       a card is one fixed 1200x630 box, so that is undone here. */
    display: block;
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--pine);
  }

  .share-card {
    width: 1200px;
    height: 630px;
    background: var(--acc, var(--pine));
    padding: 76px 88px 64px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .share-card::after {
    /* oversized mark, bottom-right, at 7% white */
    content: 'M';
    position: absolute;
    right: -46px;
    bottom: -190px;
    font: 600 520px/1 'Source Serif 4', Georgia, serif;
    color: rgba(255, 255, 255, .07);
    pointer-events: none;
  }

  .share-card-eyebrow {
    font: 500 20px/1 'IBM Plex Mono', monospace;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .72);
    margin: 0 0 34px;
    position: relative;
  }

  .share-card-headline {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    line-height: 1.08;
    letter-spacing: -.015em;
    color: #fff;
    margin: 0;
    position: relative;
    max-width: 16em;
  }

  .share-card-headline em {
    font-style: italic;
    color: #fff;
    border-bottom: 4px solid rgba(255, 255, 255, .45);
  }

  .share-card-foot {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    position: relative;
  }

  .share-card-wordmark {
    font: 600 32px/1 'Source Serif 4', Georgia, serif;
    color: #fff;
  }
</style>
</head>
<body>

<div class="share-card">
  <p class="share-card-eyebrow" id="eyebrow"></p>
  <h1 class="share-card-headline" id="headline"></h1>
  <div class="share-card-foot">
    <span class="share-card-wordmark">mvdm.io</span>
  </div>
</div>

<script>
  // Query-string read — see the head comment for why this file may carry
  // an inline script. Build input only: eyebrow/headline/product are
  // taken from the site's own pages at deploy time, never from a reader,
  // so writing headline as innerHTML below is safe. The deploy render
  // always supplies eyebrow (404.html's own substitute included) — a
  // missing one there fails the deploy rather than reaching this file.
  (function () {
    var params = new URLSearchParams(location.search);
    var eyebrow = params.get('eyebrow');
    var headline = params.get('headline') || '';
    var product = params.get('product');

    if (product) {
      document.documentElement.setAttribute('data-product', product);
    }

    document.getElementById('eyebrow').textContent = eyebrow;

    var h1 = document.getElementById('headline');
    h1.innerHTML = headline;

    // Size ramp keyed to the plain-text length of the headline (tags
    // stripped), the decision the prototype's render() settled.
    var plain = headline.replace(/<[^>]+>/g, '');
    var len = plain.length;
    var size = len <= 20 ? 96 : len <= 35 ? 82 : len <= 50 ? 70 : len <= 65 ? 58 : 50;
    h1.style.fontSize = size + 'px';

    // Signal readiness to the screenshotter once web fonts are loaded, so
    // a card is never shot in a fallback font.
    document.fonts.ready.then(function () {
      document.documentElement.setAttribute('data-ready', 'true');
    });
  })();
</script>

</body>
</html>
